services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vaultdev
      POSTGRES_DB: vault
    ports:
      - "5432:5432"
    volumes:
      - vault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      retries: 10
volumes:
  vault_pgdata:
